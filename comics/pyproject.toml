[project]
name = "wordpets-comics"
version = "0.1.0"
description = "Phonics-decodable comic authoring pipeline for the WordPets app"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0.1",
  "Pillow>=10.0.0",
  "google-genai>=0.3.0",
  "openai>=1.40.0",
  "pytesseract>=0.3.10",
  "img2pdf>=0.6.3",
  "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
