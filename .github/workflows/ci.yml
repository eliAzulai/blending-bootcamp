name: CI

# Phase 1 mechanical gate (darkFactiry Phase 1): lint + tests on every push/PR.
# Scope: the tracked TS engine tests (vitest). The kb/comics Python suites are
# venv-specific and partly local-only; the nightly runner covers those.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
